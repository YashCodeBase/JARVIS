<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
<style>
  :root {
    --bg: #05070a;
    --panel: #0d1117;
    --accent: #4fd1ff;
    --accent-dim: #1c4b5c;
    --danger: #ff6b6b;
    --text: #e6f1f5;
    --text-dim: #7f97a3;

    /* State colors -- each JARVIS mode gets its own identity */
    --c-ready: #4fd1ff;
    --c-listening: #ff5470;
    --c-thinking: #9b7bff;
    --c-speaking: #2de8b0;

    /* Active state color, swapped by [data-state] below */
    --state: var(--c-ready);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(79,209,255,0.06), transparent 60%),
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: auto, 42px 42px, 42px 42px;
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    padding: 14px 20px 0;
    border-bottom: 1px solid var(--accent-dim);
  }
  .headerTop {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
  }
  header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 5px;
    font-weight: 700;
    margin: 0;
    color: var(--accent);
  }
  #muteBtn, #registerBtn {
    background: none;
    border: 1px solid var(--accent-dim);
    color: var(--text-dim);
    height: 32px;
    border-radius: 8px;
    font-size: 12px;
    padding: 0 10px;
    transition: border-color 0.2s, color 0.2s;
  }
  #muteBtn:hover, #registerBtn:hover { border-color: var(--accent); color: var(--text); }
  #muteBtn { width: 32px; padding: 0; font-size: 14px; margin-left: auto; }
  #muteBtn.active { border-color: var(--accent); color: var(--accent); }

  /* ---------- Orb ---------- */
  .orbZone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-bottom: 16px;
  }
  .orbWrap {
    position: relative;
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .orbHalo {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--state) 0%, transparent 70%);
    opacity: 0.35;
    filter: blur(6px);
    animation: breathe 4s ease-in-out infinite;
    transition: background 0.4s;
  }
  .orbRing {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 2px dashed var(--state);
    opacity: 0.6;
    animation: spin 12s linear infinite;
    transition: border-color 0.4s;
  }
  .orbCore {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, var(--state) 55%, var(--state) 100%);
    box-shadow: 0 0 20px var(--state), 0 0 40px var(--state);
    animation: corePulse 4s ease-in-out infinite;
    transition: background 0.4s, box-shadow 0.4s;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.15); opacity: 0.5; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes corePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* State: LISTENING -- faster, tighter pulse, urgent color */
  .orbWrap[data-state="LISTENING"] .orbRing { animation-duration: 3s; }
  .orbWrap[data-state="LISTENING"] .orbCore { animation: corePulse 0.9s ease-in-out infinite; }
  .orbWrap[data-state="LISTENING"] .orbHalo { animation-duration: 1.2s; }

  /* State: THINKING -- fast spin, processing feel */
  .orbWrap[data-state="THINKING"] .orbRing { animation-duration: 1.4s; }
  .orbWrap[data-state="THINKING"] .orbCore { animation: corePulse 0.6s ease-in-out infinite; }

  /* State: SPEAKING -- steady glow, waveform does the talking */
  .orbWrap[data-state="SPEAKING"] .orbRing { animation-duration: 6s; }
  .orbWrap[data-state="SPEAKING"] .orbCore { animation: corePulse 2s ease-in-out infinite; }

  .statusText {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--state);
    transition: color 0.4s;
  }

  /* ---------- Waveform (only meaningful during SPEAKING) ---------- */
  .waveform {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 16px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .waveform.active { opacity: 1; }
  .waveform span {
    width: 3px;
    border-radius: 2px;
    background: var(--c-speaking);
    animation: wave 1s ease-in-out infinite;
  }
  .waveform span:nth-child(1) { animation-delay: 0s; }
  .waveform span:nth-child(2) { animation-delay: 0.1s; }
  .waveform span:nth-child(3) { animation-delay: 0.2s; }
  .waveform span:nth-child(4) { animation-delay: 0.3s; }
  .waveform span:nth-child(5) { animation-delay: 0.15s; }
  @keyframes wave {
    0%, 100% { height: 4px; }
    50% { height: 16px; }
  }

  /* ---------- Chat ---------- */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
    animation: rise 0.25s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .user { align-self: flex-end; background: var(--accent-dim); color: var(--text); }
  .jarvis { align-self: flex-start; background: var(--panel); border: 1px solid var(--accent-dim); color: var(--text); }

  /* ---------- Input bar ---------- */
  #inputBar {
    display: flex;
    padding: 16px;
    gap: 10px;
    border-top: 1px solid var(--accent-dim);
  }
  #textInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--accent-dim);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #textInput:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #001018;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #micBtn {
    width: 44px; padding: 0; font-size: 18px; flex-shrink: 0;
    transition: background 0.2s;
  }
  #micBtn.listening { background: var(--c-listening); animation: micPulse 1s infinite; }
  @keyframes micPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orbHalo, .orbRing, .orbCore, .waveform span, #micBtn.listening, .msg {
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <header>
    <div class="headerTop">
      <h1>J A R V I S</h1>
      <button id="registerBtn" title="Register this device for Face/Fingerprint login">Register Device</button>
      <button id="muteBtn" title="Toggle voice replies">🔊</button>
    </div>
    <div class="orbZone">
      <div class="orbWrap" id="orbWrap" data-state="READY">
        <div class="orbHalo"></div>
        <div class="orbRing"></div>
        <div class="orbCore"></div>
      </div>
      <div class="waveform" id="waveform">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="statusText" id="statusText">READY</div>
    </div>
  </header>
  <div id="chat"></div>
  <div id="inputBar">
    <button id="micBtn" title="Hold to talk">🎤</button>
    <input id="textInput" type="text" placeholder="Type or tap the mic..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const muteBtn = document.getElementById('muteBtn');
const registerBtn = document.getElementById('registerBtn');
const statusText = document.getElementById('statusText');
const orbWrap = document.getElementById('orbWrap');
const waveform = document.getElementById('waveform');

let voiceMuted = false;

function setStatus(state) {
  statusText.textContent = state;
  orbWrap.dataset.state = state;
  waveform.classList.toggle('active', state === 'SPEAKING');
}

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function speak(text) {
  if (voiceMuted || !('speechSynthesis' in window)) { setStatus('READY'); return; }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1.05;
  utterance.onstart = () => setStatus('SPEAKING');
  utterance.onend = () => setStatus('READY');
  utterance.onerror = () => setStatus('READY');
  window.speechSynthesis.speak(utterance);
}

async function sendMessage(text) {
  const messageText = (text !== undefined ? text : input.value).trim();
  if (!messageText) return;
  addMessage(messageText, 'user');
  input.value = '';
  sendBtn.disabled = true;
  setStatus('THINKING');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: messageText })
    });
    const data = await res.json();
    const replyText = data.reply || '(no response)';
    addMessage(replyText, 'jarvis');
    speak(replyText);
  } catch (err) {
    addMessage('Error reaching Jarvis: ' + err, 'jarvis');
    setStatus('READY');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', () => sendMessage());
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

muteBtn.addEventListener('click', () => {
  voiceMuted = !voiceMuted;
  muteBtn.textContent = voiceMuted ? '🔇' : '🔊';
  muteBtn.classList.toggle('active', !voiceMuted);
  if (voiceMuted) window.speechSynthesis.cancel();
});
muteBtn.classList.add('active');

registerBtn.addEventListener('click', async () => {
  try {
    registerBtn.disabled = true;
    registerBtn.textContent = 'Follow phone prompt...';
    const optionsRes = await fetch('/webauthn/register/begin');
    const optionsJSON = await optionsRes.json();
    const attResp = await SimpleWebAuthnBrowser.startRegistration(optionsJSON);
    const verifyRes = await fetch('/webauthn/register/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(attResp)
    });
    const verifyData = await verifyRes.json();
    if (verifyData.verified) {
      registerBtn.textContent = 'Registered ✓';
    } else {
      registerBtn.textContent = 'Register Device';
      alert('Registration failed: ' + (verifyData.error || 'unknown error'));
    }
  } catch (err) {
    registerBtn.textContent = 'Register Device';
    alert('Registration error: ' + err);
  } finally {
    registerBtn.disabled = false;
  }
});

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognitionAPI) {
  const recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  let isListening = false;
  recognition.onstart = () => { isListening = true; micBtn.classList.add('listening'); setStatus('LISTENING'); };
  recognition.onresult = (event) => { sendMessage(event.results[0][0].transcript); };
  recognition.onerror = (event) => { console.error('Speech recognition error:', event.error); setStatus('READY'); };
  recognition.onend = () => { isListening = false; micBtn.classList.remove('listening'); if (statusText.textContent === 'LISTENING') setStatus('READY'); };
  micBtn.addEventListener('click', () => {
    if (isListening) { recognition.stop(); }
    else { window.speechSynthesis.cancel(); recognition.start(); }
  });
} else {
  micBtn.disabled = true;
  micBtn.title = 'Speech recognition not supported in this browser (use Chrome)';
}
</script>
</body>
</html>

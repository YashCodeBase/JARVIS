<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
</head>
<body>
  <header>
    <div class="headerTop">
      <h1>J A R V I S</h1>
      <div class="modeToggle" id="modeToggle">
        <button class="modeBtn" data-mode="fast" title="Always fast, simpler answers">FAST</button>
        <button class="modeBtn active" data-mode="auto" title="Fast by default, upgrades for complex questions">AUTO</button>
        <button class="modeBtn" data-mode="deep" title="Always best reasoning, slower">DEEP</button>
      </div>
      <button id="registerBtn" title="Register this device for Face/Fingerprint login">Register Device</button>
      <button id="muteBtn" title="Toggle voice replies">🔊</button>
      <a href="{{ url_for('settings') }}" id="settingsLink" title="Settings">⚙</a>
      <div id="gestureDebug">GESTURE: NONE</div>

    </div>
    <div class="orbZone">
      <div class="orbWrap" id="orbWrap" data-state="READY">
        <div class="orbHalo"></div>
        <div class="orbRing"></div>
        <div class="orbCore"></div>
      </div>
      <div class="waveform" id="waveform">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="statusText" id="statusText">READY</div>
    </div>
  </header>
  <div id="chat"></div>
  <div id="inputBar">
    <button id="micBtn" title="Hold to talk">🎤</button>
    <input id="textInput" type="text" placeholder="Type or tap the mic..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

<video id="gestureVideo" autoplay playsinline style="display:none;"></video>

<script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>

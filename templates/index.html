<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
<style>
  :root {
    --bg: #05070a;
    --panel: #0d1117;
    --accent: #4fd1ff;
    --accent-dim: #1c4b5c;
    --danger: #ff6b6b;
    --text: #e6f1f5;
    --text-dim: #7f97a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--accent-dim);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .dot.listening {
    background: var(--danger);
    box-shadow: 0 0 8px var(--danger), 0 0 16px var(--danger);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  header h1 {
    font-size: 16px;
    letter-spacing: 4px;
    font-weight: 600;
    margin: 0;
    color: var(--accent);
  }
  .status {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-left: auto;
  }
  #muteBtn, #registerBtn {
    background: none;
    border: 1px solid var(--accent-dim);
    color: var(--text-dim);
    height: 32px;
    border-radius: 8px;
    font-size: 12px;
    padding: 0 10px;
  }
  #muteBtn { width: 32px; padding: 0; font-size: 14px; }
  #muteBtn.active { border-color: var(--accent); color: var(--accent); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: var(--accent-dim); color: var(--text); }
  .jarvis { align-self: flex-start; background: var(--panel); border: 1px solid var(--accent-dim); color: var(--text); }
  #inputBar {
    display: flex;
    padding: 16px;
    gap: 10px;
    border-top: 1px solid var(--accent-dim);
  }
  #textInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--accent-dim);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  #textInput:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #001018;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #micBtn { width: 44px; padding: 0; font-size: 18px; flex-shrink: 0; }
  #micBtn.listening { background: var(--danger); animation: pulse 1s infinite; }
</style>
</head>
<body>
  <header>
    <div class="dot" id="statusDot"></div>
    <h1>J A R V I S</h1>
    <span class="status" id="statusText">READY</span>
    <button id="registerBtn" title="Register this device for Face/Fingerprint login">Register Device</button>
    <button id="muteBtn" title="Toggle voice replies">🔊</button>
  </header>
  <div id="chat"></div>
  <div id="inputBar">
    <button id="micBtn" title="Hold to talk">🎤</button>
    <input id="textInput" type="text" placeholder="Type or tap the mic..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const muteBtn = document.getElementById('muteBtn');
const registerBtn = document.getElementById('registerBtn');
const statusText = document.getElementById('statusText');
const statusDot = document.getElementById('statusDot');

let voiceMuted = false;

function setStatus(state) {
  statusText.textContent = state;
  statusDot.classList.toggle('listening', state === 'LISTENING');
}

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function speak(text) {
  if (voiceMuted || !('speechSynthesis' in window)) { setStatus('READY'); return; }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1.05;
  utterance.onstart = () => setStatus('SPEAKING');
  utterance.onend = () => setStatus('READY');
  utterance.onerror = () => setStatus('READY');
  window.speechSynthesis.speak(utterance);
}

async function sendMessage(text) {
  const messageText = (text !== undefined ? text : input.value).trim();
  if (!messageText) return;
  addMessage(messageText, 'user');
  input.value = '';
  sendBtn.disabled = true;
  setStatus('THINKING');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: messageText })
    });
    const data = await res.json();
    const replyText = data.reply || '(no response)';
    addMessage(replyText, 'jarvis');
    speak(replyText);
  } catch (err) {
    addMessage('Error reaching Jarvis: ' + err, 'jarvis');
    setStatus('READY');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', () => sendMessage());
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

muteBtn.addEventListener('click', () => {
  voiceMuted = !voiceMuted;
  muteBtn.textContent = voiceMuted ? '🔇' : '🔊';
  muteBtn.classList.toggle('active', !voiceMuted);
  if (voiceMuted) window.speechSynthesis.cancel();
});
muteBtn.classList.add('active');

registerBtn.addEventListener('click', async () => {
  try {
    registerBtn.disabled = true;
    registerBtn.textContent = 'Follow phone prompt...';
    const optionsRes = await fetch('/webauthn/register/begin');
    const optionsJSON = await optionsRes.json();
    const attResp = await SimpleWebAuthnBrowser.startRegistration(optionsJSON);
    const verifyRes = await fetch('/webauthn/register/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(attResp)
    });
    const verifyData = await verifyRes.json();
    if (verifyData.verified) {
      registerBtn.textContent = 'Registered ✓';
    } else {
      registerBtn.textContent = 'Register Device';
      alert('Registration failed: ' + (verifyData.error || 'unknown error'));
    }
  } catch (err) {
    registerBtn.textContent = 'Register Device';
    alert('Registration error: ' + err);
  } finally {
    registerBtn.disabled = false;
  }
});

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognitionAPI) {
  const recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  let isListening = false;
  recognition.onstart = () => { isListening = true; micBtn.classList.add('listening'); setStatus('LISTENING'); };
  recognition.onresult = (event) => { sendMessage(event.results[0][0].transcript); };
  recognition.onerror = (event) => { console.error('Speech recognition error:', event.error); setStatus('READY'); };
  recognition.onend = () => { isListening = false; micBtn.classList.remove('listening'); if (statusText.textContent === 'LISTENING') setStatus('READY'); };
  micBtn.addEventListener('click', () => {
    if (isListening) { recognition.stop(); }
    else { window.speechSynthesis.cancel(); recognition.start(); }
  });
} else {
  micBtn.disabled = true;
  micBtn.title = 'Speech recognition not supported in this browser (use Chrome)';
}
</script>
</body>
</html>

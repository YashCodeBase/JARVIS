<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Login</title>
<style>
  :root {
    --bg: #05070a;
    --panel: #0d1117;
    --accent: #4fd1ff;
    --accent-dim: #1c4b5c;
    --danger: #ff6b6b;
    --text: #e6f1f5;
    --text-dim: #7f97a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 32px;
    width: 300px;
    text-align: center;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent);
    margin: 0 auto 16px;
  }
  h1 {
    font-size: 16px;
    letter-spacing: 4px;
    font-weight: 600;
    margin: 0 0 24px;
    color: var(--accent);
  }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--accent-dim);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    background: var(--accent);
    color: #001018;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  .error {
    color: var(--danger);
    font-size: 13px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>J A R V I S</h1>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
      <button type="submit">Unlock</button>
    </form>
  </div>
</body>
</html>
